name: build and push image

# RunPod 자체 GitHub 빌더 대신 Actions 에서 굽는 이유: 캐시·재빌드를 우리가 통제하고,
# RunPod 에 레포 접근 권한을 주지 않아도 된다(이미지만 당겨간다).
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # ★ 러너 디스크를 비운다. 베이스(vllm/vllm-openai)만 ~8GB 라 기본 상태로는 빌드 중
      # "no space left on device" 로 죽는다. 안 쓰는 사전설치 툴체인을 걷어내면 ~20GB 가 는다.
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # linux/amd64 못박음 — RunPod GPU 워커는 amd64 다. 맥(arm64)에서 굽지 않는 이유이기도 하다.
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # ⚠️ 가중치는 이미지에 굽지 않는다(BAKE_WEIGHTS=0). GitHub 호스티드 러너 디스크로는
          # 베이스 8GB + 가중치 8GB + 레이어 사본을 감당하지 못한다. 대신 RunPod 쪽에
          # 네트워크 볼륨을 붙이고 HF_HOME 을 그 위로 보내 콜드스타트를 흡수한다
          # (README 배포 절차 참고). 굽고 싶으면 self-hosted 러너에서 1 로 올린다.
          build-args: BAKE_WEIGHTS=0
          cache-from: type=gha
          cache-to: type=gha,mode=max

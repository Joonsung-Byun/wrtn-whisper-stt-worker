name: build and push image

# RunPod 자체 GitHub 빌더 대신 Actions 에서 굽는 이유: 캐시·재빌드를 우리가 통제하고,
# RunPod 에 레포 접근 권한을 주지 않아도 된다(이미지만 당겨간다).
on:
  push:
    branches: [main, "bisect/**"]
    # 문서만 고칠 때 6분짜리 이미지 빌드를 돌리지 않는다.
    paths-ignore: ['**.md']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # ★ 러너 디스크를 비운다. 베이스(vllm/vllm-openai)만 ~8GB 라 기본 상태로는 빌드 중
      # "no space left on device" 로 죽는다. 안 쓰는 사전설치 툴체인을 걷어내면 ~20GB 가 는다.
      # ★ 러너 디스크를 비운다. 베이스(vllm/vllm-openai) 압축 해제분에 **가중치 8GB 까지**
      # 얹으므로 기본 상태(여유 ~14GB)로는 "no space left on device" 로 죽는다. 안 쓰는
      # 사전설치 툴체인·도커 프리로드 이미지를 걷어내면 ~40GB 대까지 확보된다.
      - name: free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /usr/local/share/boost /opt/hostedtoolcache "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/share/powershell /usr/share/swift
          docker image prune -af
          df -h /

      # ⚠️ ghcr 태그는 소문자만 받는다. github.repository 는 계정명 대소문자를 그대로 주므로
      # (Joonsung-Byun/...) 그대로 쓰면 "repository name must be lowercase" 로 빌드가 죽는다.
      - name: compute lowercase image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # linux/amd64 못박음 — RunPod GPU 워커는 amd64 다. 맥(arm64)에서 굽지 않는 이유이기도 하다.
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:run-${{ github.run_number }}
          # ★ run-N 태그: RunPod 은 같은 sha 태그를 다시 릴리스하면 머신에 남은 옛 레이어를
          # 재사용해 "라벨은 새 릴리스, 동작은 옛 코드"가 된다(실측 2026-08-17 — 릴리스 9 가
          # 8 처럼 동작, 이미지 안에는 새 코드가 있었다). 매 빌드 고유 태그로 캐시를 우회한다.
          # 공식 vLLM 이미지 위에 오디오 확장(librosa·soundfile)만 얹는 얇은 레이어다.
          # 가중치도 굽지 않고 추가 의존성도 없어 새로 쌓이는 레이어는 수십 MB 수준이다.
          # ⚠️ GHA 캐시는 레포당 10GB 상한이라 이 베이스(압축 ~10GB)에는 쓸 수 없다 — 껐다.
